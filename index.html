<style>

}

    color: #b57b82;

textarea {
    width: 100%;

    background: #050102;

#error {

.arcade {
    margin-top: 35px;
    padding: 25px;

    box-shadow: 0 0 30px rgba(150, 10, 30, 0.3);

.arcade h2 {

}

    color: #9d666d;

}

    animation: shake 0.07s infinite alternate;
}

@keyframes shake {
    from {

    }

    }
}

    width: 100%;
    padding: 16px;

            >

            </button>

        </div>

    <!-- DARK ARCADE -->

        <h2>🩸 DARK ARCADE</h2>

        <div class="arcade-subtitle">

        </div>

        <div class="slots">

            <div class="slot" id="slot1">👿</div>
            <div class="slot" id="slot2">👿</div>
            <div class="slot" id="slot3">👿</div>

        </div>

        <button
            class="spin-button"
            id="spinButton"
        >
            LOSUJ 🔴
        </button>

            class="arcade-result"
            id="arcadeResult"
        >

<script>

/* =========================
   SZYFR 216 CYFR
   ========================= */

const correctCode =
"159670553584694888530414737969552380061012356399460231735438433647461260725491449900704187310424756994471214196769050920320506043361169092981329326756828442897314193348801985885579711341956761157306653345891884989170";


function checkCode() {

    const input =
        document.getElementById("codeInput").value.trim();

    const error =
        document.getElementById("error");

    const secret =
        document.getElementById("secret");


    if (input === correctCode) {

        secret.style.display = "block";

        error.textContent = "";

        document.getElementById("codeInput").value = "";

    } else {

        secret.style.display = "none";

        if (input.length === 0) {

            error.textContent =
                "Wpisz szyfr.";

        } else if (input.length !== 216) {

            error.textContent =
                "Błędna długość. Szyfr ma 216 cyfr.";

        } else {

            error.textContent =
                "❌ Błędna sekwencja.";

        }

    }

}


function closeSecret() {

    document.getElementById("secret").style.display = "none";

    document.getElementById("codeInput").value = "";

    document.getElementById("error").textContent = "";

}


/* =========================
   DARK ARCADE
   ========================= */

const symbols = [
    { icon: "👿", weight: 50 },
    { icon: "😾", weight: 30 },
    { icon: "❤️‍🔥", weight: 14 },
    { icon: "🪙", weight: 5 },
    { icon: "6️⃣", weight: 1 }
];


function randomSymbol() {

    const total =
        symbols.reduce(
            (sum, item) => sum + item.weight,
            0
        );

    let random =
        Math.random() * total;


    for (const item of symbols) {

        random -= item.weight;

        if (random < 0) {
            return item.icon;
        }

    }

    return "👿";
}


function wait(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}


const spinButton =
    document.getElementById("spinButton");

const arcadeResult =
    document.getElementById("arcadeResult");

const slots = [
    document.getElementById("slot1"),
    document.getElementById("slot2"),
    document.getElementById("slot3")
];


spinButton.addEventListener(
    "click",
    async function () {

        spinButton.disabled = true;

        arcadeResult.className =
            "arcade-result";

        arcadeResult.textContent =
            "LOSOWANIE...";


        slots.forEach(
            slot =>
                slot.classList.add("rolling")
        );


        const animation =
            setInterval(
                function () {

                    slots.forEach(
                        slot => {
                            slot.textContent =
                                randomSymbol();
                        }
                    );

                },
                65
            );


        await wait(700);

        clearInterval(animation);


        const result = [
            randomSymbol(),
            randomSymbol(),
            randomSymbol()
        ];


        for (let i = 0; i < 3; i++) {

            await wait(180);

            slots[i].textContent =
                result[i];

        }


        slots.forEach(
            slot =>
                slot.classList.remove("rolling")
        );


        if (
            result[0] === "6️⃣" &&
            result[1] === "6️⃣" &&
            result[2] === "6️⃣"
        ) {

            arcadeResult.textContent =
                "🔥🔥🔥 TRZY SZÓSTKI! 🔥🔥🔥";

            arcadeResult.className =
                "arcade-result jackpot";

        }

        else if (
            result[0] === result[1] &&
            result[1] === result[2]
        ) {

            arcadeResult.textContent =
                "😈 TRZY TAKIE SAME!";

        }

        else if (
            result[0] === result[1] ||
            result[1] === result[2] ||
            result[0] === result[2]
        ) {

            arcadeResult.textContent =
                "❤️‍🔥 PARA!";

        }

        else {

            arcadeResult.textContent =
                "😾 Tym razem nic!";

        }


        spinButton.disabled = false;

    }
);

</script>

<div class="snake-game">

    <h2>🐍 SNAKE</h2>
    <div id="snakeScore">Wynik: 0</div>

    <canvas id="snakeCanvas" width="400" height="400"></canvas>

    <div id="snakeMessage"></div>

    <div class="snake-controls">
        <button onclick="snakeDirection(0, -1)">⬆️</button>

        <div>
            <button onclick="snakeDirection(-1, 0)">⬅️</button>
            <button onclick="snakeDirection(0, 1)">⬇️</button>
            <button onclick="snakeDirection(1, 0)">➡️</button>
        </div>
    </div>

    <button onclick="snakeRestart()" class="snake-restart">
        🔄 RESTART
    </button>

</div>


<style>

.snake-game {
    margin: 35px auto;
    text-align: center;
}

.snake-game h2 {
    margin-bottom: 5px;
}

#snakeScore {
    margin-bottom: 12px;
    font-size: 18px;
}

#snakeCanvas {
    width: min(90vw, 400px);
    height: min(90vw, 400px);
    background: #151515;
    border: 3px solid #444;
    border-radius: 12px;
    display: block;
    margin: auto;
}

#snakeMessage {
    height: 28px;
    margin-top: 10px;
    font-weight: bold;
}

    margin-top: 15px;
}

.snake-restart {
    border: none;
    background: #292929;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
}

    width: 65px;
    height: 55px;
    margin: 3px;
    font-size: 25px;
}

    transform: scale(.92);
    background: #444;
}

.snake-restart {
    margin-top: 12px;
    padding: 10px 20px;
    font-size: 16px;
}

</style>


<script>

const snakeCanvas = document.getElementById("snakeCanvas");
const snakeCtx = snakeCanvas.getContext("2d");

const snakeGrid = 20;
const snakeTile = snakeCanvas.width / snakeGrid;

let snakeBody;
let snakeApple;
let snakeDir;
let snakeNextDir;
let snakePoints;
let snakeDead;

function snakeStart() {

    snakeBody = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    snakeDir = {x: 1, y: 0};
    snakeNextDir = {x: 1, y: 0};

    snakePoints = 0;
    snakeDead = false;

    document.getElementById("snakeMessage").textContent = "";

    snakeCreateApple();
    snakeDraw();
    snakeUpdateScore();
}

function snakeCreateApple() {

    do {
        snakeApple = {
            x: Math.floor(Math.random() * snakeGrid),
            y: Math.floor(Math.random() * snakeGrid)
        };
    }
    while (
        snakeBody.some(
            part =>
                part.x === snakeApple.x &&
                part.y === snakeApple.y
        )
    );
}

function snakeUpdateScore() {

    document.getElementById("snakeScore").textContent =
        "Wynik: " + snakePoints;
}

function snakeDraw() {

    snakeCtx.fillStyle = "#151515";

    snakeCtx.fillRect(
        0,
        0,
        snakeCanvas.width,
        snakeCanvas.height
    );

    // JABŁKO 🍎
    snakeCtx.font = "19px Arial";
    snakeCtx.textAlign = "center";
    snakeCtx.textBaseline = "middle";

    snakeCtx.fillText(
        "🍎",
        snakeApple.x * snakeTile + snakeTile / 2,
        snakeApple.y * snakeTile + snakeTile / 2
    );

    // WĄŻ 🐍
    snakeBody.forEach((part, index) => {

        snakeCtx.fillStyle =
            index === 0 ? "#7cff4f" : "#35a832";

        snakeCtx.fillRect(
            part.x * snakeTile + 1,
            part.y * snakeTile + 1,
            snakeTile - 2,
            snakeTile - 2
        );
    });
}

function snakeDirection(x, y) {

    if (
        snakeDir.x === -x &&
        snakeDir.y === -y
    ) {
        return;
    }

    snakeNextDir = {
        x: x,
        y: y
    };
}

function snakeMove() {

    if (snakeDead) return;

    snakeDir = snakeNextDir;

    const head = {
        x: snakeBody[0].x + snakeDir.x,
        y: snakeBody[0].y + snakeDir.y
    };

    // ŚCIANA
    if (
        head.x < 0 ||
        head.x >= snakeGrid ||
        head.y < 0 ||
        head.y >= snakeGrid
    ) {
        snakeGameOver();
        return;
    }

    // WŁASNE CIAŁO
    if (
        snakeBody.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )
    ) {
        snakeGameOver();
        return;
    }

    snakeBody.unshift(head);

    // JABŁKO
    if (
        head.x === snakeApple.x &&
        head.y === snakeApple.y
    ) {

        snakePoints++;

        snakeUpdateScore();
        snakeCreateApple();

    } else {

        snakeBody.pop();
    }

    snakeDraw();
}

function snakeGameOver() {

    snakeDead = true;

    document.getElementById("snakeMessage").textContent =
        "💀 GAME OVER — wynik: " + snakePoints;
}

function snakeRestart() {
    snakeStart();
}


// KLAWIATURA

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") {
        snakeDirection(0, -1);
    }

    if (event.key === "ArrowDown") {
        snakeDirection(0, 1);
    }

    if (event.key === "ArrowLeft") {
        snakeDirection(-1, 0);
    }

    if (event.key === "ArrowRight") {
        snakeDirection(1, 0);
    }

});


// START

snakeStart();


// PRĘDKOŚĆ

setInterval(snakeMove, 120);

</script>

<style>

<script>

let saperRows;
let saperCols;
let saperMines;

let saperBoard = [];
let saperGameOver = false;
let saperRevealed = 0;


// START GRY

function startSaper(level) {

    saperGameOver = false;
    saperRevealed = 0;

    if (level === "easy") {

        // EASY
        saperRows = 9;
        saperCols = 9;
        saperMines = 10;

    } else {

        // HARD
        saperRows = 16;
        saperCols = 16;
        saperMines = 40;

    }

    document.getElementById("saperInfo").textContent =
        level === "easy"
        ? "🟢 EASY — 9×9 | 💣 10 min"
        : "🔴 HARD — 16×16 | 💣 40 min";

    document.getElementById("saperMessage").textContent = "";

    createSaperBoard();
}


// TWORZENIE PLANSZY

function createSaperBoard() {

    saperBoard = [];

    const boardElement =
        document.getElementById("saperBoard");

    boardElement.innerHTML = "";

    boardElement.style.gridTemplateColumns =
        `repeat(${saperCols}, 1fr)`;


    // PUSTE POLA

    for (let y = 0; y < saperRows; y++) {

        saperBoard[y] = [];

        for (let x = 0; x < saperCols; x++) {

            saperBoard[y][x] = {
                mine: false,
                revealed: false,
                flagged: false,
                number: 0
            };
        }
    }


    // LOSOWANIE MIN

    let minesPlaced = 0;

    while (minesPlaced < saperMines) {

        const x =
            Math.floor(Math.random() * saperCols);

        const y =
            Math.floor(Math.random() * saperRows);

        if (!saperBoard[y][x].mine) {

            saperBoard[y][x].mine = true;

            minesPlaced++;
        }
    }


    // LICZENIE MIN OBOK

    for (let y = 0; y < saperRows; y++) {

        for (let x = 0; x < saperCols; x++) {

            if (saperBoard[y][x].mine) continue;

            let count = 0;

            for (let dy = -1; dy <= 1; dy++) {

                for (let dx = -1; dx <= 1; dx++) {

                    if (dx === 0 && dy === 0)
                        continue;

                    const nx = x + dx;
                    const ny = y + dy;

                    if (
                        nx >= 0 &&
                        nx < saperCols &&
                        ny >= 0 &&
                        ny < saperRows &&
                        saperBoard[ny][nx].mine
                    ) {
                        count++;
                    }
                }
            }

            saperBoard[y][x].number = count;
        }
    }


    drawSaperBoard();
}


// RYSOWANIE

function drawSaperBoard() {

    const boardElement =
        document.getElementById("saperBoard");

    boardElement.innerHTML = "";

    for (let y = 0; y < saperRows; y++) {

        for (let x = 0; x < saperCols; x++) {

            const cell = saperBoard[y][x];

            const button =
                document.createElement("button");

            button.className = "saper-cell";

            if (cell.revealed) {

                button.classList.add("revealed");

                if (cell.mine) {

                    button.textContent = "💣";
                    button.classList.add("mine");

                } else if (cell.number > 0) {

                    button.textContent = cell.number;

                }

            } else if (cell.flagged) {

                button.textContent = "🚩";
                button.classList.add("flag");

            } else {

                button.textContent = "";
            }


            button.onclick = () => {

                revealSaperCell(x, y);

            };


            // PRAWY KLIK = FLAGA

            button.oncontextmenu = (event) => {

                event.preventDefault();

                flagSaperCell(x, y);

            };


            boardElement.appendChild(button);
        }
    }
}


// ODKRYWANIE

function revealSaperCell(x, y) {

    if (saperGameOver)
        return;

    const cell = saperBoard[y][x];

    if (cell.revealed || cell.flagged)
        return;


    // MINA 💣

    if (cell.mine) {

        cell.revealed = true;

        saperGameOver = true;

        revealAllSaperMines();

        document.getElementById("saperMessage").textContent =
            "💥 BOOM! Przegrałeś 😾";

        drawSaperBoard();

        return;
    }


    cell.revealed = true;
    saperRevealed++;


    // PUSTE POLE = ODKRYJ OKOLICĘ

    if (cell.number === 0) {

        for (let dy = -1; dy <= 1; dy++) {

            for (let dx = -1; dx <= 1; dx++) {

                if (dx === 0 && dy === 0)
                    continue;

                const nx = x + dx;
                const ny = y + dy;

                if (
                    nx >= 0 &&
                    nx < saperCols &&
                    ny >= 0 &&
                    ny < saperRows
                ) {

                    revealSaperCell(nx, ny);
                }
            }
        }
    }


    drawSaperBoard();

    checkSaperWin();
}


// FLAGA 🚩

function flagSaperCell(x, y) {

    if (saperGameOver)
        return;

    const cell = saperBoard[y][x];

    if (cell.revealed)
        return;

    cell.flagged = !cell.flagged;

    drawSaperBoard();
}


// ODKRYJ WSZYSTKIE MINY

function revealAllSaperMines() {

    for (let y = 0; y < saperRows; y++) {

        for (let x = 0; x < saperCols; x++) {

            if (saperBoard[y][x].mine) {

                saperBoard[y][x].revealed = true;
            }
        }
    }
}


// SPRAWDZANIE WYGRANEJ

function checkSaperWin() {

    let safeCells = 0;

    for (let y = 0; y < saperRows; y++) {

        for (let x = 0; x < saperCols; x++) {

            if (
                !saperBoard[y][x].mine &&
                saperBoard[y][x].revealed
            ) {
                safeCells++;
            }
        }
    }


    const totalSafe =
        saperRows * saperCols - saperMines;


    if (safeCells === totalSafe) {

        saperGameOver = true;

        document.getElementById("saperMessage").textContent =
            "🏆 WYGRAŁEŚ! Wszystkie bezpieczne pola odkryte! 🤑";

        drawSaperBoard();
    }
}
